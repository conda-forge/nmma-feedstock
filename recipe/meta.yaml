{% set python_min = "3.12" %}
{% set name = "nmma" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/nmma-{{ version }}.tar.gz
  sha256: 4e0741cad9e4f3d6fe3f8d4c39a8db201a15832a4f0fb9cab6f0eb962cc4a2c2
  patches:
    # tensorflow-cpu is provided on conda-forge by tensorflow-base, whose
    # dist-info is named `tensorflow`, so rewrite the metadata requirement to
    # match and keep `pip check` happy (the run dep stays tensorflow-cpu).
    - tensorflow-cpu-metadata.patch

build:
  # Console scripts are declared in nmma's pyproject.toml ([project.scripts])
  # and created automatically by pip, so they are not duplicated here.
  script: |
    {{ PYTHON }} -m pip install . -vv
  number: 0
  noarch: python

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - arviz >=1.2
    - astropy-base >=6.0
    - bilby >=2.7.1
    - bilby_pipe >=1.7.0
    - colorcet
    - corner
    - dust_extinction
    - dynesty
    - future
    - gwpy
    - healpy
    - h5py
    - huggingface_hub
    - joblib
    - lal
    - lalsimulation
    - ligo.skymap
    - ligo-followup-advocate
    - matplotlib-base >=3.8
    - mpi4py
    - nestcheck
    - notebook
    - numpy >2.0
    - pandas >2.0
    - parallel-bilby
    - p-tqdm
    - pymultinest
    - python >={{ python_min }}
    - pyyaml
    - requests
    - schwimmbad
    - scikit-learn >=1.0.2
    - scipy >=1.15
    - seaborn
    # schwimmbad imports pkg_resources at import time, which ships with setuptools
    - setuptools
    - sncosmo
    - tensorflow-cpu >=2.19
    - toml
    - tornado
    - tqdm
    - ultranest
    - multiprocess <=0.70.16

test:
  imports:
    - nmma
  commands:
    - pip check
    - lightcurve-analysis --help
    - lightcurve-analysis-lbol --help
    - nmma-analysis --help
    - lightcurve-injection-slurm-setup --help
    - combine-EOS --help
    - create-lightcurve-slurm --help
    - create-svdmodel --help
    - svdmodel-benchmark --help
    - plot-svdmodel-benchmarks --help
    - lightcurve-generation --help
    - gwem-resampling --help
    - gwem-Hubble-estimate --help
    - convert-skyportal-lcs --help
    - resample-grid --help
    - multi-config-analysis --help
  requires:
    - pip
    - mpi4py
    - nestcheck
    - python {{ python_min }}

about:
  home: https://github.com/nuclear-multimessenger-astronomy/nmma
  summary: A nuclear physics multi-messenger Bayesian inference library
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sahiljhawar
    - mcoughlin
